<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!----======== CSS ======== -->
  <link rel="stylesheet" href="assets/css/Styles.css">

  <!----===== Iconscout CSS ===== -->
  <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.8/css/line.css">

  <!----======== FAVICON======== -->
  <link rel="icon" type="image/png" href="assets/img/favicon.png">


  <title>NFlores Transportes</title>

</head>

<body>
  <nav>
    <div class="logo-name">
      <div class="logo-image">
        <img src="assets/img/nfloreslogo.png" alt="">
      </div>
      <span class="logo_name">NFlores</span>
    </div>

    <div class="menu-items">
      <ul class="nav-links">
        <li>
          <a href="index.html" class="active">
            <i class="uil uil-truck"></i>
            <span class="link-name">MIS ENVÍOS</span>
          </a>
        </li>
      </ul>

      <ul class="logout-mode">
        <li><a href="#">
            <i class="uil uil-signout"></i>
            <span class="link-name">CERRAR CESIÓN</span>
          </a></li>
        <li class="mode">
          <a href="#">
            <i class="uil uil-moon"></i>
            <span class="link-name">MODO OSCURO</span>
          </a>
          <div class="mode-toggle">
            <span class="switch"></span>
          </div>
        </li>
      </ul>
    </div>
  </nav>

  <section class="dashboard">
    <div class="top">
      <i class="uil uil-bars sidebar-toggle"></i>
      <div class="test">
        <span class="user-title">¡Bienvenido!&nbsp; </span>
        <img src="assets/img/tailoy.png" alt="" class="iconfix">
      </div>
    </div>

    <div class="dash-content">
      <div class="overview">
        <div class="test2">
          <input id="date-end" type="date" class="test3" placeholder="dd/mm/yyyy" />
          <button class="buttonfix" id="btn-search-date" onclick="filterByDate()">
            Consultar
          </button>
        </div>

        <div class="test2">
          <form id="form" action="post" class="test5">
            <select class="list" name="select1" id="">
              <option value="disabled selected">Elige un campo</option>
              <option value="ejemplo1">Guía de remisión</option>
              <option value="ejemplo2">Cliente</option>
              <option value="ejemplo3">Dirección</option>
              <option value="ejemplo4">Departamento</option>
              <option value="ejemplo5">Provincia</option>
              <option value="ejemplo6">Estado</option>
            </select>
          </form>

          <input type="text" name="search" id="search" class="test7" placeholder="Buscar" />
          <button class="buttonfix" id="btn-search-field" onclick="filterByField()">
            Filtrar
          </button>
        </div>
      </div>


      <div class="tabla-container">
        <table class="tabla__content">
          <thead>
            <tr>
              <!-- <th class="separacion">#</th> -->
              <th class="separacion">Inicio</th>
              <th class="separacion">G. Remisión</th>
              <th class="separacion">Cliente</th>
              <th class="separacion">Dirección</th>
              <th class="separacion">Departamento</th>
              <th class="separacion">Provincia</th>
              <th class="separacion">Estado</th>
            </tr>
          </thead>

          <tbody id="table-body">
            <!-- Las filas se generarán dinámicamente con JavaScript -->
          </tbody>
        </table>
      </div>
    </div>
  </section>

  <script src="assets/js/index.js"></script>
</body>

</html>
